name: Triage Router Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SN_INSTANCE: ${{ secrets.SN_INSTANCE }}
      SN_USER: ${{ secrets.SN_USER }}
      SN_PASSWORD: ${{ secrets.SN_PASSWORD }}
      SN_TEST_USER_SYS_ID: ${{ secrets.SN_TEST_USER_SYS_ID }}
    steps:
      - name: Wake instance
        run: |
          INSTANCE_URL="https://${{ secrets.SN_INSTANCE }}.service-now.com"
          echo "Waking instance..."
          # First request follows the redirect to trigger the wake-up
          curl -s -L -o /dev/null -w "Wake trigger: HTTP %{http_code}\n" "$INSTANCE_URL/stats.do"
          # Now poll until it's actually up
          for i in $(seq 1 20); do
            sleep 15
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L "$INSTANCE_URL/stats.do")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Instance is awake!"
              exit 0
            fi
          done
          echo "Instance did not wake in time"
          exit 1

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -v
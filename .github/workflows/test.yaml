name: Triage Router Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SN_INSTANCE: ${{ secrets.SN_INSTANCE }}
      SN_USER: ${{ secrets.SN_USER }}
      SN_PASSWORD: ${{ secrets.SN_PASSWORD }}
      SN_TEST_USER_SYS_ID: ${{ secrets.SN_TEST_USER_SYS_ID }}
    steps:
      - name: Wake instance
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s --max-time 30 -o /dev/null -w "%{http_code}" "https://${SN_INSTANCE}.service-now.com/stats.do")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then break; fi
            sleep 30
          done

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -v